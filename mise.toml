[tools]
python = "3.13"
ruff = "latest"
"pipx:pytest" = "latest"
resvg = "latest"

[tasks.lint]
description = "Ruff lint and format check"
run = ["ruff check .", "ruff format --check ."]

[tasks.format]
description = "Format code with ruff"
run = ["ruff format .", "ruff check --fix ."]

[tasks.test]
description = "Run unit tests"
run = "pytest -q"

[tasks.deploy]
description = "Copy the integration to the Home Assistant host over SSH (host alias 'ha')"
run = """
set -euo pipefail
COPYFILE_DISABLE=1 tar -C custom_components --exclude='__pycache__' -cf - livoltek_local \
  | ssh ha 'sudo rm -rf /config/custom_components/livoltek_local && sudo mkdir -p /config/custom_components && sudo tar -C /config/custom_components -xf - && ls /config/custom_components/livoltek_local'
"""

[tasks.restart]
description = "Validate config and restart Home Assistant Core"
run = "ssh ha '. /etc/profile.d/homeassistant.sh && ha core check && ha core restart'"

[tasks.icons]
description = "Render the brand PNGs (256 and 512 px, light and dark) from assets/*.svg"
run = """
set -euo pipefail
out=custom_components/livoltek_local/brand
resvg -w 256 -h 256 assets/icon-light.svg $out/icon.png
resvg -w 512 -h 512 assets/icon-light.svg $out/icon@2x.png
resvg -w 256 -h 256 assets/icon-dark.svg $out/dark_icon.png
resvg -w 512 -h 512 assets/icon-dark.svg $out/dark_icon@2x.png
"""
